format_version: '11'
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git

workflows:
  primary:
    steps:
    - activate-ssh-key@4:
        run_if: '{{getenv "SSH_RSA_PRIVATE_KEY" | ne ""}}'
    - git-clone@8: {}
    - flutter-installer@0:
        inputs:
        - is_update: 'false'
        - version: '3.24.0'
    - flutter-build@0:
        inputs:
        - platform: 'android'
        - build_type: 'apk'
    - deploy-to-bitrise-io@2: {}
